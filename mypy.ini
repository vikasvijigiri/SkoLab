# Type checking for the hook and tool scripts. Enabled 2026-08-03.
#
# `typecheck` had been `false` in .claude/project-checks.json on the assumption
# that an unannotated codebase would produce hundreds of findings. Measured
# instead of assumed: six errors across nineteen files, all one pattern
# (`spec_from_file_location` returning `ModuleSpec | None`), all real, all fixed
# with asserts that improve the failure message. The assumption was wrong.
#
# `_projectchecks.detect_checks` looks for this file by name, so its existence is
# what turns type checking on. A fresh clone without mypy installed skips the
# check with a note rather than failing -- see `tool_missing`.

[mypy]
python_version = 3.11
files = .claude/hooks, tools

# `.claude/hooks/pre-tool/01-halt-guard.py` does `from tools.halt import status`,
# so mypy sees `tools/halt.py` as `tools.halt`; walking `files = tools` it also
# discovers the same file as bare `halt` and errors on the clash. Pinning the
# package base to the repo root makes every discovered file resolve to one
# canonical dotted name.
namespace_packages = True
explicit_package_bases = True
mypy_path = .

# The hooks load each other by path at runtime, and the suites load the modules
# under test the same way. mypy cannot follow that, and the alternative is a
# stub package for code that is already in this repo.
ignore_missing_imports = True

# Deliberately not strict. The goal is catching real defects in untyped code --
# a None flowing where an object is expected, an attribute that cannot exist --
# not annotating nineteen files to satisfy a checker. `disallow_untyped_defs`
# would turn six findings into several hundred overnight, and a gate that noisy
# is one people route around.
check_untyped_defs = True
warn_redundant_casts = True
warn_unused_ignores = True

# Hooks end in `except Exception: pass` on purpose; that is not dead code.
warn_no_return = False

# Every event dir's dispatcher is named `00-dispatch.py` by convention --
# `tools/run_hook.py` resolves `event_dir / "00-dispatch.py"` for any event, so
# the shared basename is load-bearing, not an accident (see the note in
# `tools/test_hook_registration.py`). mypy derives a module name from the
# basename and cannot qualify it (leading digit + hyphenated dir = no valid
# dotted path), so two `00-dispatch.py` files are a hard "Duplicate module"
# error that aborts the whole run. Renaming to satisfy mypy would break the
# runtime convention, so instead exclude the smaller (subprocess-chaining)
# `stop-finalization` one; the security-check dispatcher in `permission-security/`
# -- the one with real branching logic -- stays type-checked.
exclude = (?x)/stop-finalization/00-dispatch\.py$

[mypy-docs.archive.*]
ignore_errors = True
