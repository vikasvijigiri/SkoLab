# Paid rollout candidate. Do not switch the Blueprint path until approved.
# Existing API secrets and its secret-file mount must be retained on Render.
services:
  - type: web
    name: skolab-api
    runtime: docker
    repo: https://github.com/vikasvijigiri/SkoLab
    branch: master
    region: singapore
    plan: 0.5c-512mb
    numInstances: 2
    dockerfilePath: ./deploy/skolab-api/Dockerfile
    dockerContext: .
    preDeployCommand: python scripts/check_connection_budget.py && python scripts/run_migrations.py
    healthCheckPath: /readyz
    autoDeployTrigger: "off"
    envVars:
      - key: APP_ENV
        value: production
      - key: GIN_MODE
        value: release
      - key: PORT
        value: "8080"
      - key: SKIP_STARTUP_MIGRATIONS
        value: "1"
      - key: RUN_DB_CREATE_ALL
        value: "0"
      - key: SHARED_STATE_REQUIRED
        value: "true"
      - key: SHARED_STATE_REDIS_URL
        fromService:
          name: skolab-shared-state
          type: keyvalue
          property: connectionString
      - key: COLAB_REQUIRE_SANDBOX
        value: "true"
      - key: COLAB_SANDBOX_HOSTPORT
        fromService:
          name: skolab-colab-sandbox
          type: pserv
          property: hostport
      # Four is the ceiling including two old + two new rollout instances.
      - key: APP_MAX_INSTANCES
        value: "4"
      - key: DB_MAX_CONNS
        value: "5"
      - key: DB_MIN_CONNS
        value: "1"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: DB_POOL_SIZE
        value: "3"
      - key: DB_MAX_OVERFLOW
        value: "2"
      - key: DB_RESERVED_CONNECTIONS
        value: "10"
      # Verify the actual project's usable pool capacity; never assume a tier limit.
      - key: DB_CONNECTION_BUDGET
        sync: false
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/service-account.json
      - key: OTEL_EXPORTER_OTLP_PROTOCOL
        value: http/protobuf
      - key: USER_QUOTA_ENABLED
        value: "true"
      # Least-privilege login in the skolab_app role; migrations (the
      # preDeployCommand) use the schema owner. deploy/AUDIT-2026-10-08.md item 4.
      - key: DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: DATABASE_ENCRYPTION_KEY
        sync: false
      - key: EMAIL_BLIND_INDEX_KEY
        sync: false
      - key: INTERNAL_API_TOKEN
        sync: false
      - key: APP_BASE_URL
        sync: false
      # Browser origins allowed to call the API, comma-separated.
      - key: CORS_ORIGINS
        value: https://skolab-web.onrender.com
  - type: pserv
    name: skolab-colab-sandbox
    runtime: docker
    repo: https://github.com/vikasvijigiri/SkoLab
    branch: master
    region: singapore
    plan: 0.5c-512mb
    numInstances: 2
    dockerfilePath: ./services/backend-go/Dockerfile.colab-sandbox
    dockerContext: ./services/backend-go
    healthCheckPath: /healthz
    autoDeployTrigger: "off"
    envVars:
      - key: PORT
        value: "8081"
      - key: COLAB_MAX_CONCURRENT_COMPILES
        value: "1"
      # Match the API's existing token. No database or Firebase keys on workers.
      - key: INTERNAL_API_TOKEN
        sync: false
  - type: keyvalue
    name: skolab-shared-state
    region: singapore
    plan: 256mb
    maxmemoryPolicy: noeviction
    ipAllowList: []

  # The web app: a static single-page app on Render's CDN (free; no instance
  # hours). Render builds it only after every GitHub check on the commit
  # passes, and only when apps/web changes.
  - type: web
    name: skolab-web
    runtime: static
    repo: https://github.com/vikasvijigiri/SkoLab
    branch: master
    rootDir: apps/web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: checksPass
    pullRequestPreviewsEnabled: false
    buildFilter:
      paths:
        - apps/web/**
    # Copied from apps/web/security-headers.json; the web CI job fails if
    # they drift apart.
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' https://apis.google.com; style-src 'self'; img-src 'self' data: https://*.googleusercontent.com; font-src 'self'; connect-src 'self' https://skolab-api.onrender.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.googleapis.com; frame-src https://*.firebaseapp.com https://accounts.google.com; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=63072000; includeSubDomains"
      - path: /*
        name: X-Content-Type-Options
        value: "nosniff"
      - path: /*
        name: Referrer-Policy
        value: "strict-origin-when-cross-origin"
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), payment=()"
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: "same-origin-allow-popups"
      - path: /assets/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
      - path: /index.html
        name: Cache-Control
        value: "no-cache"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_BASE_URL
        value: https://skolab-api.onrender.com
      # Firebase console > Project settings > Your apps > Web app. Public
      # identifiers, not secrets, but kept out of the repo with the rest.
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
