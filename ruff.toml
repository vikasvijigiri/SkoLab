# Lint config for repo-root Python (scripts/, tests/) — services/backend and
# services/backend-go have their own.

line-length = 100
target-version = "py311"

exclude = [".git", "__pycache__", "docs/archive"]

[lint]
# E,F  pycodestyle errors + pyflakes -- the default, and the set that caught the
#      unused imports.
# I    import sorting.
# B    bugbear: mutable default args, loop-variable capture, the bugs that read
#      as correct code.
# S    bandit's rules, native to ruff, so `shell=True` is caught here instead of
#      needing a second tool in the chain. The two legitimate sites carry
#      per-line `# noqa: S602` with the reason.
# UP   pyupgrade -- this repo is py311+ only.
select = ["E", "F", "I", "B", "S", "UP"]

ignore = [
    "E501",    # line length is checked by the formatter's judgement, not a hard stop
    "S101",    # `assert` is how the test suites here assert
    "S404",    # scripts/ legitimately shells out (git, npm, docker, ...)
    "S603",    # subprocess without shell -- the safe form, flagged anyway
    "S607",    # partial executable path: `git`, `npm` and `python` come from PATH
              # by design
]

[lint.per-file-ignores]
# These two files ARE the repository's secret detectors: their bodies are tables
# of credential regexes (`sk-...`, `AIzaSy...`, PEM headers). The cosmetic
# import-order rule is off for these two rather than reordering imports around
# pattern tables that read better linearly.
"scripts/security/detect_secrets.py" = ["I001"]
"scripts/security/scan_history_secrets.py" = ["I001"]
