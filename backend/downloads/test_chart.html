<!DOCTYPE html>
<html>
<head>
    <title>Publications Over Time</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #0b0c10;
            color: #ffffff;
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .chart-container {
            position: relative;
            width: 100%;
            max-width: 700px;
            background: #1f2833;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            box-sizing: border-box;
        }
        h2 {
            margin-top: 0;
            font-size: 1.25rem;
            font-weight: 700;
            color: #c5a059;
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="chart-container">
        <h2>Publications Over Time</h2>
        <canvas id="myChart"></canvas>
    </div>
    <script>
        const ctx = document.getElementById('myChart').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ["2024", "2023", "2022"],
                datasets: [{"data": [15, 10, 5], "label": "Publications", "backgroundColor": "rgba(255, 179, 0, 0.2)", "borderColor": "rgba(255, 179, 0, 1)", "borderWidth": 2}]
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                plugins: {
                    legend: {
                        labels: {
                            color: '#c5a059',
                            font: { size: 12 }
                        }
                    }
                },
                scales: {
                    x: {
                        grid: { color: 'rgba(255, 255, 255, 0.05)' },
                        ticks: { color: '#c5c6c7' }
                    },
                    y: {
                        grid: { color: 'rgba(255, 255, 255, 0.05)' },
                        ticks: { color: '#c5c6c7' }
                    }
                }
            }
        });
    </script>
</body>
</html>
