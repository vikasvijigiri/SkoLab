openapi: 3.0.0
info:
  title: SkoLab Monorepo API Spec
  version: 1.1.0
  description: Unified API schema contract for SkoLab Go Gateway and FastAPI backend.

paths:
  /gateway-health:
    get:
      summary: Health check for the Go API Gateway
      responses:
        '200':
          description: Gateway is online
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  service:
                    type: string

  /health:
    get:
      summary: Deep health check verifying DB and Cache
      responses:
        '200':
          description: All services are healthy
        '503':
          description: One or more dependencies are unhealthy

  /api/v1/author_suggestions:
    get:
      summary: Search for author suggestions
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of matching authors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuthorSuggestion'

  /api/v1/orbit_metrics:
    get:
      summary: Retrieve co-authorship and publication metrics
      parameters:
        - name: author_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Discovered co-authors and statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrbitMetrics'

  /api/v1/users/quests:
    get:
      summary: Fetch or dynamically initialize user quests
      security:
        - BearerAuth: []
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of active quests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Quest'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    AuthorSuggestion:
      type: object
      properties:
        id:
          type: string
        display_name:
          type: string
        institution:
          type: string
        field_of_study:
          type: string
          nullable: true
        h_index:
          type: integer
          nullable: true
        innovation_score:
          type: integer
        works_count:
          type: integer
          nullable: true

    OrbitMetrics:
      type: object
      properties:
        collaborator_count:
          type: integer
        institution_count:
          type: integer
        works_count:
          type: integer
        cited_by_count:
          type: integer
        h_index:
          type: integer
        i10_index:
          type: integer
        top_coauthors:
          type: array
          items:
            type: string

    Quest:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        reward_entropy:
          type: integer
        is_completed:
          type: boolean
