global:
  scrape_interval: 15s

rule_files:
  - "alertmanager-alerts.yml"

scrape_configs:
  # The Python FastAPI service no longer exposes /metrics — its per-process
  # MetricsStore was retired (docs/plans/2026-09-04-retire-python-infra.md).
  # Request metrics belong to the Go API gateway, which fronts every request.
  #
  # Resolved 2026-09-05: services/backend-go/internal/metrics serves this
  # path — RED metrics (http_requests_total, http_request_duration_seconds,
  # http_requests_in_flight), hand-rolled against the standard library
  # rather than adding a prometheus/client_golang dependency (see that
  # package's doc comment for why). Same exposition format either way; this
  # target now returns real data.
  - job_name: 'skolab-gateway'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:8080']
