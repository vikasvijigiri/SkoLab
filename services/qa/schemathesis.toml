# Schemathesis settings for the contract-fuzzing step (CI staging).

# page_token is opaque: only a token this API issued is valid, which a
# schema cannot express, so a well-formed but made-up one is rightly 400.
[[operations]]
include-name = "GET /api/v1/workspaces"
checks.positive_data_acceptance.expected-statuses = ["2xx", "400", "401", "403", "404", "409", "429", "5xx"]

# Reusing an Idempotency-Key with a different body is refused (422) by
# design; the fuzzer reuses keys across generated bodies.
[[operations]]
include-name = "POST /api/v1/workspaces"
checks.positive_data_acceptance.expected-statuses = ["2xx", "401", "403", "404", "409", "422", "429", "5xx"]

# A save names the version it was based on; a generated base_version that
# is not the current one is rightly refused with 409 version_conflict.
[[operations]]
include-name = "PUT /api/v1/workspaces/{id}/document"
checks.positive_data_acceptance.expected-statuses = ["2xx", "401", "403", "404", "409", "429", "5xx"]
# A source over 100,000 characters is refused with the documented 413
# document_too_large, which the fuzzer's default rejection list leaves out.
checks.negative_data_rejection.expected-statuses = ["400", "401", "403", "404", "405", "406", "409", "413", "415", "422", "428", "429", "5xx"]

# Project files: a schema-valid path can still be refused by rules a schema
# cannot express (reserved main.tex/output.pdf, a text file needs a known
# extension: 415), an existing path is 409, and generated uploads and .zip
# archives are not real files (400 invalid_archive, 415 unsupported_file_type).
[[operations]]
include-name = "POST /api/v1/workspaces/{id}/files"
checks.positive_data_acceptance.expected-statuses = ["2xx", "400", "401", "403", "404", "409", "413", "415", "429", "5xx"]

[[operations]]
include-name = "POST /api/v1/workspaces/{id}/files/upload"
checks.positive_data_acceptance.expected-statuses = ["2xx", "400", "401", "403", "404", "409", "413", "415", "429", "5xx"]

[[operations]]
include-name = "PATCH /api/v1/workspaces/{id}/files/{file_id}"
checks.positive_data_acceptance.expected-statuses = ["2xx", "400", "401", "403", "404", "409", "415", "429", "5xx"]

[[operations]]
include-name = "PUT /api/v1/workspaces/{id}/files/{file_id}"
checks.positive_data_acceptance.expected-statuses = ["2xx", "400", "401", "403", "404", "409", "413", "429", "5xx"]
checks.negative_data_rejection.expected-statuses = ["400", "401", "403", "404", "405", "406", "409", "413", "415", "422", "428", "429", "5xx"]

[[operations]]
include-name = "POST /api/v1/workspaces/import"
checks.positive_data_acceptance.expected-statuses = ["2xx", "400", "401", "403", "409", "413", "429", "5xx"]

# A new workspace has no output.pdf until its first compile: 404 no_output
# is the documented answer, not a resource lost after creation.
[[operations]]
include-name = "GET /api/v1/workspaces/{id}/output.pdf"
checks.ensure_resource_availability.enabled = false
