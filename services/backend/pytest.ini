[pytest]
# pythonpath = .: `tests/` has no `__init__.py`, so pytest's default rootdir
# sys.path insertion (prepend mode) adds only `tests/` itself, never
# `services/backend` — `tests/conftest.py`'s `from app...` imports then fail
# with `ModuleNotFoundError: No module named 'app'` under the bare `pytest`
# console-script entry point (reproduced locally; `python -m pytest` masks
# it because `-m` always adds cwd to sys.path, which is *not* what CI's
# `pytest -q` / `pytest tests/ ...` invocations do). This ini option is
# pytest's own built-in fix for exactly this layout, in place since 7.0.
pythonpath = .
# asyncio_mode = auto: many async tests (test_backend_reliability, test_data_quality,
# test_discovery, ...) carry no @pytest.mark.asyncio marker. Under pytest-asyncio's
# default strict mode they would be collected as sync and error. Added 2026-09-01
# when pytest-asyncio was first pinned in requirements-dev.txt.
asyncio_mode = auto
testpaths = tests
markers =
    asyncio: mark test as async using asyncio
    anyio: mark test as async using anyio
filterwarnings =
    ignore::pytest.PytestConfigWarning
    ignore::pytest.PytestUnknownMarkWarning
    ignore::DeprecationWarning
    ignore::UserWarning
