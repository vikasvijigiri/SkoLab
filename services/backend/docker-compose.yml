version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: skolab_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: skolab
    networks:
      - private-net
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1g
        reservations:
          memory: 256m

  web:
    build: .
    container_name: skolab_python_ai
    restart: always
    ports:
      - "8000:8000"
    networks:
      - public-net
      - private-net
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@db:5432/skolab
    depends_on:
      - db
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2g
        reservations:
          memory: 512m

  gateway:
    build: ../backend-go
    container_name: skolab_go_gateway
    restart: always
    ports:
      - "8080:8080"
    networks:
      - public-net
      - private-net
    environment:
      - PYTHON_BACKEND_URL=http://web:8000
      - GOOGLE_APPLICATION_CREDENTIALS=/app/service-account.json
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/skolab?sslmode=disable
    volumes:
      - ./service-account.json:/app/service-account.json:ro
    depends_on:
      - web

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: skolab_uptime_kuma
    restart: always
    ports:
      - "3005:3001"
    volumes:
      - uptime_kuma_data:/app/data
    networks:
      - public-net

volumes:
  postgres_data:
  uptime_kuma_data:

networks:
  public-net:
    driver: bridge
  private-net:
    driver: bridge
