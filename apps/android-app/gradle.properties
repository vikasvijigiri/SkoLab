android.useAndroidX=true
android.enableJetifier=false
org.gradle.jvmargs=-Xmx5120m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+UseParallelGC -Xshare:off -XX:TieredStopAtLevel=1
