android.useAndroidX=true
android.enableJetifier=false
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=256m -XX:+UseParallelGC -Xshare:off -XX:TieredStopAtLevel=1
