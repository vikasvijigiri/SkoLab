# Backend-only Render Blueprint. Both services deploy from `master`.
services:
  - type: web
    name: skolab-gateway
    runtime: docker
    repo: https://github.com/vikasvijigiri/SkoLab
    branch: master
    plan: free
    region: oregon
    dockerfilePath: ./services/backend-go/Dockerfile
    dockerContext: ./services/backend-go
    healthCheckPath: /gateway-health
    envVars:
      - key: PORT
        value: "8080"
      - key: GIN_MODE
        value: release
      - key: APP_ENV
        value: production
      - key: OTEL_SERVICE_NAME
        value: skolab-gateway
      - key: OTEL_EXPORTER_OTLP_PROTOCOL
        value: http/protobuf
      - key: OTEL_TRACES_SAMPLER_ARG
        value: "1"
      - key: PYTHON_BACKEND_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DB_MAX_CONNS
        value: "15"
      - key: DB_MIN_CONNS
        value: "3"
      - key: REDIS_URL
        sync: false
      - key: INTERNAL_API_TOKEN
        sync: false
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/service-account.json
      # Set once services/backend-go/cmd/colab-sandbox is deployed as its own
      # container (docs/deploy/colab-sandbox.md). Unset ⇒ falls back to
      # proxying /colab/compile to skolab-backend-py.
      - key: COLAB_SANDBOX_URL
        sync: false

  - type: web
    name: skolab-backend-py
    runtime: docker
    repo: https://github.com/vikasvijigiri/SkoLab
    branch: master
    plan: free
    region: oregon
    dockerfilePath: ./services/backend/Dockerfile
    dockerContext: ./services/backend
    healthCheckPath: /livez
    envVars:
      - key: APP_ENV
        value: production
      - key: OTEL_SERVICE_NAME
        value: skolab-backend-py
      - key: OTEL_EXPORTER_OTLP_PROTOCOL
        value: http/protobuf
      - key: OTEL_TRACES_SAMPLER_ARG
        value: "1"
      - key: PORT
        value: "8000"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_ENCRYPTION_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: INTERNAL_API_TOKEN
        sync: false
      - key: RUN_DB_CREATE_ALL
        sync: false
      - key: GOOGLE_APPLICATION_CREDENTIALS
        sync: false
      - key: EMAIL_BLIND_INDEX_KEY
        sync: false
      # Per-user cost quota on /colab/compile — see app/core/quota.py.
      - key: USER_QUOTA_ENABLED
        value: "true"
      - key: USER_QUOTA_HOURLY_UNITS
        sync: false
      - key: USER_QUOTA_DAILY_UNITS
        sync: false
