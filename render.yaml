# Render Blueprint — the Go API gateway, the Python/FastAPI backend, and the
# Next.js frontend, all on the free plan. The frontend used to target Vercel
# (see DEPLOY.md's original rationale — Next.js is Vercel's own framework,
# and its CDN-served static pages have no cold start); moved here instead
# because Render was already fully wired for this project with zero
# friction, and `next start`'s standalone output is just a persistent Node
# process — exactly what a Render web service wants. The tradeoff is the
# same 15-minute-idle cold start the other two services here already accept.
#
# The Python service used to target a Hugging Face Docker Space, but HF moved
# Docker Spaces behind a paid plan (2026-09). It now fits Render's free 512 MB
# tier because embeddings run via the Hugging Face Inference API instead of a
# bundled PyTorch model (see app/services/ai/embedding_service.py) — the image
# dropped from ~2.5 GB to ~350 MB.
#
# First deploy: Render dashboard -> New -> Blueprint -> pick this repo. Render
# reads this file, creates all three services, and prompts for every
# `sync: false` value below. Redeploys happen on push to `branch`.
#
# After the Python service's first successful deploy, set the gateway's
# PYTHON_BACKEND_URL to `https://skolab-backend-py.onrender.com`.
#
# skolab-web's own NEXT_PUBLIC_* values are inlined into the client bundle at
# BUILD time (Next.js convention) — they need to be real at the very first
# build, not patched in afterward like PYTHON_BACKEND_URL above.

services:
  - type: web
    name: skolab-gateway
    runtime: docker
    repo: https://github.com/vikasvijigiri/SkoLab
    branch: main
    plan: free
    region: oregon
    dockerfilePath: ./services/backend-go/Dockerfile
    dockerContext: ./services/backend-go
    healthCheckPath: /gateway-health
    envVars:
      # main.go binds a hardcoded ":8080"; tell Render to route to that port
      # rather than its default 10000. (Alternative: teach main.go to read PORT
      # — see DEPLOY.md "Optional code change".)
      - key: PORT
        value: "8080"
      # Fail Firebase auth closed instead of falling back to a dev user.
      - key: GIN_MODE
        value: release
      # Full https URL of the skolab-backend-py service below, e.g.
      # https://skolab-backend-py.onrender.com — set it after that service is
      # live (Render `fromService` can't supply the scheme the gateway needs).
      - key: PYTHON_BACKEND_URL
        sync: false
      # Supabase "Connection string" -> "URI", TRANSACTION pooler (port 6543).
      # The gateway is configured for pgBouncer txn mode (pgx QueryExecModeExec);
      # a direct :5432 connection blows the free tier's ~60-connection ceiling.
      - key: DATABASE_URL
        sync: false
      # pgxpool sizing — kept small so Go + Python together stay under the
      # shared pooler ceiling. Defaults (15 / 3) apply if unset.
      - key: DB_MAX_CONNS
        value: "15"
      - key: DB_MIN_CONNS
        value: "3"
      # Comma-separated exact origins allowed by the gateway CORS layer
      # (internal/middleware/cors.go) — skolab-web's own Render URL below.
      - key: CORS_ORIGINS
        value: https://skolab-web.onrender.com
      # Optional. Leave unset for memory-only pub/sub; set to an Upstash
      # redis:// URL to share state across instances.
      - key: REDIS_URL
        sync: false
      # firebase.NewApp(ctx, nil) uses Application Default Credentials, i.e. a
      # service-account JSON file at this path. Upload that JSON in the Render
      # dashboard as a Secret File named service-account.json (mounted under
      # /etc/secrets), then keep this value pointing at it.
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/service-account.json

  # ── Python / FastAPI backend (services/backend) ────────────────────────────
  - type: web
    name: skolab-backend-py
    runtime: docker
    repo: https://github.com/vikasvijigiri/SkoLab
    branch: main
    plan: free
    region: oregon                      # co-locate with the gateway
    dockerfilePath: ./services/backend/Dockerfile
    dockerContext: ./services/backend
    healthCheckPath: /livez             # liveness only — no dependency calls
    envVars:
      - key: APP_ENV
        value: production
      # The Dockerfile CMD binds :8000; tell Render's router to match.
      - key: PORT
        value: "8000"
      # One uvicorn worker fits 512 MB. Raise on a bigger instance.
      - key: WEB_CONCURRENCY
        value: "1"
      # Supabase Transaction pooler URI, asyncpg scheme:
      # postgresql+asyncpg://postgres.<ref>:<pwd>@...pooler.supabase.com:6543/postgres
      - key: DATABASE_URL
        sync: false
      # REQUIRED in production — the app refuses to boot with the shipped
      # default or an empty value. Generate:
      #   python -c "import base64,os;print(base64.b64encode(os.urandom(32)).decode())"
      - key: DATABASE_ENCRYPTION_KEY
        sync: false
      - key: GROQ_API
        sync: false
      # Any random string — gates the /metrics and /ai_status admin routes.
      - key: SRE_SECURITY_TOKEN
        sync: false
      # Hugging Face token (read scope) — enables the embedding backend. Unset
      # ⇒ recommendation match scores floor to the minimum but nothing 500s.
      - key: HF_INFERENCE_TOKEN
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: APP_BASE_URL
        sync: false
      # Set to "1" for the FIRST deploy only — the app then runs
      # Base.metadata.create_all to build the schema (the Alembic migrations
      # cannot bootstrap an empty DB). Blank it once /livez is green.
      - key: RUN_DB_CREATE_ALL
        sync: false
      # Optional: upload the Firebase service-account JSON as a Secret File
      # named service-account.json and point this at it. Only the /agent/chat
      # route needs it; every other route works without.
      - key: GOOGLE_APPLICATION_CREDENTIALS
        sync: false

  # ── Next.js frontend (apps/web) ─────────────────────────────────────────────
  # Build context is the REPO ROOT, not apps/web — see apps/web/Dockerfile's
  # own header comment for why (npm workspace resolution).
  - type: web
    name: skolab-web
    runtime: docker
    repo: https://github.com/vikasvijigiri/SkoLab
    branch: main
    plan: free
    region: oregon                      # co-locate with the gateway + backend
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      # The Dockerfile's CMD binds :3000 (Next's own standalone-output default).
      - key: PORT
        value: "3000"
      # Real gateway URL — NOT localhost:3000/8080 (apps/web/.env.local's dev
      # default). Build-time only; see the Dockerfile header comment.
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://skolab-gateway.onrender.com
      # Firebase Web app config — all public-by-design (ships in the browser
      # bundle regardless of host), copied from apps/web/.env.local.
      - key: NEXT_PUBLIC_FIREBASE_API_KEY
        value: AIzaSyA9E9Z3zFR-WPnNlFuZ80aWey3bIXPLk84
      - key: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
        value: skolab-vvi.firebaseapp.com
      - key: NEXT_PUBLIC_FIREBASE_PROJECT_ID
        value: skolab-vvi
      - key: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
        value: skolab-vvi.firebasestorage.app
      - key: NEXT_PUBLIC_FIREBASE_APP_ID
        value: "1:412488544680:web:5ec939773d50b1b933ad9d"
      - key: NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID
        value: 412488544680-jr969qv6a5aih569rmd8l8egjetl9lrg.apps.googleusercontent.com
      # Web Sentry DSN (project "skolab-web", not the backend's project) —
      # public-by-design, same reasoning as the Firebase keys above.
      - key: NEXT_PUBLIC_SENTRY_DSN
        value: https://12e2c847ce6e46d052cb7d9cd87c7f22@o4512014875426816.ingest.de.sentry.io/4512016181755984
      # Feeds app/layout.tsx's metadataBase (OG/Twitter image + canonical URL
      # resolution) — this service's own predictable Render URL.
      - key: NEXT_PUBLIC_SITE_URL
        value: https://skolab-web.onrender.com
