# Backend-only Render Blueprint. Both services deploy from `master`.
services:
  - type: web
    name: skolab-gateway
    runtime: docker
    repo: https://github.com/vikasvijigiri/SkoLab
    branch: master
    plan: free
    region: oregon
    dockerfilePath: ./services/backend-go/Dockerfile
    dockerContext: ./services/backend-go
    healthCheckPath: /gateway-health
    envVars:
      - key: PORT
        value: "8080"
      - key: GIN_MODE
        value: release
      - key: PYTHON_BACKEND_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DB_MAX_CONNS
        value: "15"
      - key: DB_MIN_CONNS
        value: "3"
      - key: REDIS_URL
        sync: false
      - key: INTERNAL_API_TOKEN
        sync: false
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/service-account.json

  - type: web
    name: skolab-backend-py
    runtime: docker
    repo: https://github.com/vikasvijigiri/SkoLab
    branch: master
    plan: free
    region: oregon
    dockerfilePath: ./services/backend/Dockerfile
    dockerContext: ./services/backend
    healthCheckPath: /livez
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: "8000"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_ENCRYPTION_KEY
        sync: false
      - key: GROQ_API
        sync: false
      - key: SRE_SECURITY_TOKEN
        sync: false
      - key: HF_INFERENCE_TOKEN
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: GATEWAY_URL
        sync: false
      - key: INTERNAL_API_TOKEN
        sync: false
      - key: RUN_DB_CREATE_ALL
        sync: false
      - key: GOOGLE_APPLICATION_CREDENTIALS
        sync: false
