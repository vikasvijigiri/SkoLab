# Render Blueprint: the API service and the web app, deployed from `master`.
#
# skolab-api runs the Go gateway (public, :8080) and the Python service
# (127.0.0.1:8000, never public) in one container -- deploy/skolab-api/.
# One free service fits Render's 750 free instance-hours a month; two
# always-on services did not. Singapore puts it beside the database
# (Supabase ap-southeast-1): ~1 ms per query instead of ~175 ms from Oregon.
#
# Deploys come from CI, not from Render: a push to master that passes every
# check runs .github/workflows/release.yml, which deploys this exact commit,
# waits until it is live and smoke-tests production.
#
# `sync: false` values are secrets set on the service (Render dashboard or
# API), never in this file. Render does not prompt for them when a Blueprint
# adds a service, so the release copies them once from the services this one
# replaced (services/release/release.py, adopt_settings).
services:
  - type: web
    name: skolab-api
    runtime: docker
    repo: https://github.com/vikasvijigiri/SkoLab
    branch: master
    plan: free
    region: singapore
    dockerfilePath: ./deploy/skolab-api/Dockerfile
    dockerContext: .
    healthCheckPath: /gateway-health
    autoDeployTrigger: "off"
    envVars:
      - key: PORT
        value: "8080"
      - key: GIN_MODE
        value: release
      - key: APP_ENV
        value: production
      - key: OTEL_EXPORTER_OTLP_PROTOCOL
        value: http/protobuf
      - key: OTEL_TRACES_SAMPLER_ARG
        value: "1"
      # Both processes share these connections' Supabase pooler budget.
      - key: DB_MAX_CONNS
        value: "15"
      - key: DB_MIN_CONNS
        value: "3"
      - key: WEB_CONCURRENCY
        value: "1"
      # One 512 MB instance hosts both processes: one compile at a time.
      - key: COLAB_MAX_CONCURRENT_COMPILES
        value: "1"
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/service-account.json
      - key: USER_QUOTA_ENABLED
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_ENCRYPTION_KEY
        sync: false
      - key: EMAIL_BLIND_INDEX_KEY
        sync: false
      - key: INTERNAL_API_TOKEN
        sync: false
      - key: SENTRY_DSN
        sync: false
      # Sentry alert webhooks relayed to Slack (POST /hooks/sentry):
      # the Sentry internal integration's client secret, and the Slack
      # incoming webhook. Either unset: the relay answers 503.
      - key: SENTRY_WEBHOOK_SECRET
        sync: false
      - key: SLACK_ALERT_WEBHOOK_URL
        sync: false
      - key: APP_BASE_URL
        sync: false
      # Browser origins allowed to call the API, comma-separated.
      - key: CORS_ORIGINS
        value: https://skolab-web.onrender.com
      - key: REDIS_URL
        sync: false
      # Only when running more than one instance: the gateway's rate limits,
      # compile slots and WebSocket broadcasts then go through this Redis.
      - key: SHARED_STATE_REDIS_URL
        sync: false
      - key: USER_QUOTA_HOURLY_UNITS
        sync: false
      - key: USER_QUOTA_DAILY_UNITS
        sync: false
      # Optional: a separately deployed colab-sandbox worker
      # (docs/deploy/colab-sandbox.md). Unset: compiles run in this
      # container's sandboxed Python worker.
      - key: COLAB_SANDBOX_URL
        sync: false

  # The web app: a static single-page app on Render's CDN (free; no instance
  # hours). Render builds it only after every GitHub check on the commit
  # passes, and only when apps/web changes.
  - type: web
    name: skolab-web
    runtime: static
    repo: https://github.com/vikasvijigiri/SkoLab
    branch: master
    rootDir: apps/web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: checksPass
    pullRequestPreviewsEnabled: false
    buildFilter:
      paths:
        - apps/web/**
    # Copied from apps/web/security-headers.json; the web CI job fails if
    # they drift apart.
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' https://apis.google.com; style-src 'self'; img-src 'self' data: https://*.googleusercontent.com; font-src 'self'; connect-src 'self' https://skolab-api.onrender.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.googleapis.com; frame-src https://*.firebaseapp.com https://accounts.google.com; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=63072000; includeSubDomains"
      - path: /*
        name: X-Content-Type-Options
        value: "nosniff"
      - path: /*
        name: Referrer-Policy
        value: "strict-origin-when-cross-origin"
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), payment=()"
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: "same-origin-allow-popups"
      - path: /assets/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
      - path: /index.html
        name: Cache-Control
        value: "no-cache"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_BASE_URL
        value: https://skolab-api.onrender.com
      # Firebase console > Project settings > Your apps > Web app. Public
      # identifiers, not secrets, but kept out of the repo with the rest.
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
