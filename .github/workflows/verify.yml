name: CI Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  python-verification:
    name: Python Linting & Test Gating
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Linting & Testing Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.16.3 pytest==8.4.2 bandit==1.9.4 pip-audit==2.10.1

      - name: Install Project Dependencies
        run: |
          if [ -f services/backend/requirements.txt ]; then pip install -r services/backend/requirements.txt; fi

      - name: Run Ruff Linter
        run: |
          ruff check services/backend/app

      - name: Run Ruff Format Check
        run: |
          ruff format --check services/backend/app

      - name: Run Bandit SAST Check
        run: |
          bandit -r services/backend/app -ll

      - name: Run Dependency Vulnerability Audit
        run: |
          pip-audit --local

  android-verification:
    name: Android Build & Lint Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Decode Google Services Configuration from Secrets
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p apps/android-app/app
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > apps/android-app/app/google-services.json
          else
            echo "WARNING: GOOGLE_SERVICES_JSON secret is empty or not set. Build may fail."
          fi

      - name: Make Gradlew Executable
        working-directory: apps/android-app
        run: chmod +x gradlew

      - name: Run Android Lint Check & Build compile verification
        working-directory: apps/android-app
        run: ./gradlew lintDevDebug assembleDevDebug
