name: CI Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  python-verification:
    name: Python Linting & Test Gating
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Linting & Testing Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest bandit pip-audit

      - name: Install Project Dependencies
        run: |
          if [ -f services/backend/requirements.txt ]; then pip install -r services/backend/requirements.txt; fi

      - name: Run Ruff Linter
        run: |
          ruff check services/backend/app

      - name: Run Ruff Format Check
        run: |
          ruff format --check services/backend/app

      - name: Run Bandit SAST Check
        run: |
          bandit -r services/backend/app -ll

      - name: Run Dependency Vulnerability Audit
        run: |
          pip-audit --local

  android-verification:
    name: Android Build & Lint Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Create Dummy google-services.json
        run: |
          mkdir -p apps/android-app/app
          echo '{"project_info":{"project_number":"123456789","project_id":"dummy-project"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789:android:12345","android_client_info":{"package_name":"com.company.skolab"}},"api_key":[{"current_key":"dummy_api_key"}],"services":{}}],"configuration_version":"3"}' > apps/android-app/app/google-services.json

      - name: Make Gradlew Executable
        working-directory: apps/android-app
        run: chmod +x gradlew

      - name: Run Android Lint Check & Build compile verification
        working-directory: apps/android-app
        run: ./gradlew lintDevDebug assembleDevDebug
