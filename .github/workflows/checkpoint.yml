name: Create checkpoint

# Marks a known-good master commit with an annotated checkpoint tag, so it
# can be released again later (deploy/CHECKPOINTS.md). Actions > Create
# checkpoint > Run workflow. Only tags; never moves or deletes anything.
on:
  workflow_dispatch:
    inputs:
      name:
        description: Tag name, checkpoint-YYYY-MM-DD-<what>
        required: true
      commit:
        description: Commit on master to tag (full or short SHA)
        required: true
      note:
        description: What was live and verified at this commit
        required: true

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: master
          fetch-depth: 0
      - name: Tag the commit
        env:
          NAME: ${{ inputs.name }}
          COMMIT: ${{ inputs.commit }}
          NOTE: ${{ inputs.note }}
          ACTOR: ${{ github.actor }}
        run: |
          [[ "$NAME" =~ ^checkpoint-[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9-]+$ ]] || { echo "::error::name must look like checkpoint-2026-10-09-login-live"; exit 1; }
          sha=$(git rev-parse --verify --quiet "${COMMIT}^{commit}") || { echo "::error::unknown commit $COMMIT"; exit 1; }
          git merge-base --is-ancestor "$sha" origin/master || { echo "::error::$sha is not on master"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/$NAME" >/dev/null; then echo "::error::tag $NAME already exists"; exit 1; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$NAME" "$sha" -m "$NOTE" -m "Created by $ACTOR via the Create checkpoint workflow. Fall back: deploy/CHECKPOINTS.md."
          git push origin "refs/tags/$NAME"
          echo "Tagged $sha as $NAME" | tee -a "$GITHUB_STEP_SUMMARY"
