name: Release to Render

# The last stage of CI on master (ci.yml calls this after every test job,
# including staging, passes): deploy the commit to Render, wait until it is
# live, smoke-test production, then bring Grafana's monitoring in line with
# what is now deployed. A merge is done only when this is green. Run it by
# hand (Actions > Release to Render > Run workflow) to redeploy or re-check.
# Secrets: RENDER_API_KEY plus the monitoring account's three login secrets
# (and the Grafana ones, for the monitoring job).
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      smoke_only:
        description: Skip deploying; only run the production smoke checks
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: render-release
      cancel-in-progress: false
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      SKOLAB_SANDBOX_SERVICE: ${{ vars.SKOLAB_SANDBOX_SERVICE }}
      SKOLAB_FIREBASE_API_KEY: ${{ secrets.SKOLAB_FIREBASE_API_KEY }}
      SKOLAB_SYNTHETIC_EMAIL: ${{ secrets.SKOLAB_SYNTHETIC_EMAIL }}
      SKOLAB_SYNTHETIC_PASSWORD: ${{ secrets.SKOLAB_SYNTHETIC_PASSWORD }}
      # Admin SDK: creates and deletes the temporary end-to-end test users.
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # skip rebuilding a service whose directory did not change
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Require successful checks before a manual deployment
        if: github.event_name == 'workflow_dispatch' && !inputs.smoke_only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python services/release/verify_ci.py --commit "$GITHUB_SHA"
      - name: Deploy, wait until live, smoke-test production
        run: python services/release/release.py --commit "$GITHUB_SHA" ${{ inputs.smoke_only && '--smoke-only' || '' }}
      - uses: ./.github/actions/qa-tools
      - name: End-to-end scenarios against production (Hurl, temporary users)
        run: bash services/qa/e2e.sh https://skolab-api.onrender.com qa-reports
      - name: QA reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: qa-reports-production
          path: qa-reports
          if-no-files-found: ignore

  monitoring:
    needs: release
    if: ${{ !inputs.smoke_only }}
    uses: ./.github/workflows/observability-deploy.yml
    secrets: inherit
