name: web

on:
  push:
    branches: [master]
    paths: [apps/web/**, render.yaml, deploy/render-ha.yaml, .github/workflows/web.yml]
  pull_request:
    branches: [master]
    paths: [apps/web/**, render.yaml, deploy/render-ha.yaml, .github/workflows/web.yml]

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: web app lint, tests, build and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Known vulnerabilities in dependencies
        run: npm audit --audit-level=high
      - name: Lint (ESLint, type-aware, jsx-a11y strict)
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Unit and component tests with coverage floor
        run: npm test
      - name: Render headers match the tested policy
        run: npm run check:headers
      - name: Production build (placeholder public config)
        env:
          VITE_API_BASE_URL: https://skolab-api.onrender.com
          VITE_FIREBASE_API_KEY: ci-placeholder
          VITE_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: ci-placeholder
          VITE_FIREBASE_APP_ID: ci-placeholder
        run: |
          npm run build
          if grep -l "__fakeAuth" dist/assets/*.js; then
            echo "::error::The in-memory test identity provider leaked into the production bundle"
            exit 1
          fi
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Browser tests (journeys, keyboard, phone layout, WCAG 2.2 AA under the production CSP)
        run: npm run e2e
        env:
          CI: "true"
      - name: Browser test report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
