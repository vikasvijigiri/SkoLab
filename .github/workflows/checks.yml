# Runs this repo's own lint, typecheck, test and build commands directly —
# no repo-specific resolver layer in between, so what CI runs is exactly
# what you can run locally from services/backend, services/backend-go, or
# the repo root.
#
# Two jobs, matching the two tiers: `fast` on every push (lint, unit tests —
# backend tests run against pytest's SQLite fallback, no service container),
# `slow` only on pull requests (build, e2e, backend tests against a real
# Postgres service container via ci_bootstrap_db.py), because a production
# build and a browser suite cost minutes.

name: checks

on:
  push:
    branches-ignore: []
  pull_request:
  # The merge queue tests `target + everything ahead of you + your change` and
  # merges only if THAT is green. Without this trigger the queue has no checks to
  # wait for and merges untested combinations -- the single most common way the
  # feature is misconfigured. Two PRs that are each green against the target can
  # still break it together: one renames a function, the other adds a call to it.
  merge_group:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: lint · typecheck · unit test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - uses: actions/setup-go@v7
        with:
          go-version-file: services/backend-go/go.mod

      - name: Install web dependencies
        # The committed lockfile is Windows-generated and `npm ci` on Linux
        # can't resolve its platform-specific optional deps (@tailwindcss/
        # oxide, lightningcss natives) reliably — see the identical
        # workaround + full explanation in ci.yml's "Install workspace
        # dependencies" step. Durable fix there too: a Linux-regenerated
        # lockfile + `npm ci`.
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund --legacy-peer-deps \
            || { rm -rf node_modules ~/.npm/_cacache; npm install --no-audit --no-fund --legacy-peer-deps; }

      - name: Web lint
        run: npm run lint --workspace apps/web

      - name: Web unit tests
        run: npm run test --workspace apps/web

      - name: Contract check (backend ErrorResponse vs the shared JSON schema)
        run: python scripts/verify_contracts.py

      - name: Install backend dependencies
        working-directory: services/backend
        run: pip install --quiet -r requirements.txt -r requirements-dev.txt

      - name: Backend lint
        working-directory: services/backend
        run: ruff check .

      - name: Backend unit tests (SQLite fallback, no Postgres needed)
        working-directory: services/backend
        # GROQ_API/OPENROUTER_API_KEY: `is_llm_working()` (app/core/config.py
        # Settings.groq_api_key defaults to "" when unset) returns False with
        # neither set, so IndustryAcademicService.get_tieups and anything
        # else gated on it silently takes its non-LLM fallback path instead
        # of the one tests actually mock -- confirmed by reproducing
        # test_industry_academic.py::test_get_tieups_cache_miss_success's
        # exact CI failure locally by unsetting these two vars, and fixing
        # it the same way by setting them. Values match ci.yml's already-
        # proven placeholders (never real keys, no live LLM calls happen in
        # tests -- only is_llm_working()'s truthiness check reads them).
        env:
          GROQ_API: ci-test-groq-token-not-secret
          OPENROUTER_API_KEY: ci-test-openrouter-token-not-secret
        run: pytest -q

      - name: Go vet
        working-directory: services/backend-go
        run: go vet ./...

      - name: Go tests
        working-directory: services/backend-go
        run: go test ./...

  slow:
    name: build · e2e · backend (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The queue is the last point at which the slow tier can catch an
    # integration break, and it is the only run that sees the actual merged
    # result.
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    services:
      postgres:
        # pgvector/pgvector image = stock postgres + the `vector` extension
        # available for `CREATE EXTENSION` (see the identical comment on
        # ci.yml's postgres service, which already gets this right). Plain
        # `postgres:16` errors on `CREATE EXTENSION IF NOT EXISTS vector`
        # ("extension ... is not available") -- and since ci_bootstrap_db.py
        # runs every DDL statement in one transaction, that one failure
        # poisons the whole thing, silently no-opping every table it tries
        # to create after it (including unrelated ones like `users`), while
        # still printing "[ci] schema bootstrap ok" and exiting 0. That's
        # what "relation ... does not exist" errors in the pytest run right
        # after this step actually were.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: skolab
          POSTGRES_PASSWORD: skolab
          POSTGRES_DB: skolab
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install web dependencies
        # See the matching step + comment in the `fast` job above.
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund --legacy-peer-deps \
            || { rm -rf node_modules ~/.npm/_cacache; npm install --no-audit --no-fund --legacy-peer-deps; }

      - name: Web build (includes Next.js typecheck)
        run: npm run build --workspace apps/web

      - name: Install Playwright browsers
        run: npx --prefix apps/web playwright install --with-deps

      - name: Web e2e
        run: npm run test:e2e --workspace apps/web

      - name: Install backend dependencies
        working-directory: services/backend
        run: pip install --quiet -r requirements.txt -r requirements-dev.txt

      - name: Bootstrap backend schema against CI Postgres
        working-directory: services/backend
        env:
          DATABASE_URL: postgresql+asyncpg://skolab:skolab@localhost:5432/skolab
        run: python ci_bootstrap_db.py

      - name: Backend tests against real Postgres
        working-directory: services/backend
        # See the matching step + comment in the `fast` job above -- same
        # fix, so this job can't pass or fail this test by accident
        # depending on unrelated test-count/ordering differences between
        # the SQLite and Postgres runs.
        env:
          DATABASE_URL: postgresql+asyncpg://skolab:skolab@localhost:5432/skolab
          GROQ_API: ci-test-groq-token-not-secret
          OPENROUTER_API_KEY: ci-test-openrouter-token-not-secret
        run: pytest -q

  # The ONE required check. Branch protection names this job and nothing else, so
  # adding or renaming a tier never means editing repository settings -- the
  # failure mode where a check silently stops being required.
  #
  # `if: !cancelled()` is load-bearing: a skipped job counts as SUCCESS to
  # GitHub, so a plain `needs:` would report green when its dependencies were
  # skipped.
  #
  # EVERY JOB ABOVE MUST BE LISTED IN `needs:`.
  conclusion:
    name: conclusion
    needs: [fast, slow]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check that every dependency passed or was legitimately skipped
        run: |
          jq -C <<< '${{ toJson(needs) }}'
          jq --exit-status 'all(.result == "success" or .result == "skipped")' \
            <<< '${{ toJson(needs) }}'
