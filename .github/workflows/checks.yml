name: checks

on:
  push:
  pull_request:
  merge_group:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: backend lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v7
        with:
          go-version-file: services/backend-go/go.mod
      - name: Install backend dependencies
        working-directory: services/backend
        run: pip install --quiet -r requirements.txt -r requirements-dev.txt
      - name: Backend lint
        working-directory: services/backend
        run: ruff check .
      - name: Backend type-check (informational)
        working-directory: services/backend
        # Non-blocking — see ci.yml's identical step for why.
        continue-on-error: true
        run: mypy app/ --ignore-missing-imports
      - name: Backend unit tests
        working-directory: services/backend
        env:
          GROQ_API: ci-test-groq-token-not-secret
          OPENROUTER_API_KEY: ci-test-openrouter-token-not-secret
        run: pytest -q
      - name: Go vet and tests
        working-directory: services/backend-go
        run: |
          go vet ./...
          go test ./...
      - name: Go formatting check (informational)
        working-directory: services/backend-go
        # Non-blocking — see ci.yml's identical step for why.
        continue-on-error: true
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::warning::gofmt would reformat:"
            echo "$unformatted"
            exit 1
          fi

  slow:
    name: backend integration tests (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: skolab
          POSTGRES_PASSWORD: skolab
          POSTGRES_DB: skolab
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: services/backend
        run: pip install --quiet -r requirements.txt -r requirements-dev.txt
      - name: Bootstrap backend schema
        working-directory: services/backend
        env:
          DATABASE_URL: postgresql+asyncpg://skolab:skolab@localhost:5432/skolab
        run: python ci_bootstrap_db.py
      - name: Backend tests against Postgres
        working-directory: services/backend
        env:
          DATABASE_URL: postgresql+asyncpg://skolab:skolab@localhost:5432/skolab
          GROQ_API: ci-test-groq-token-not-secret
          OPENROUTER_API_KEY: ci-test-openrouter-token-not-secret
        run: pytest -q

  conclusion:
    name: conclusion
    needs: [fast, slow]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify dependency results
        run: |
          jq --exit-status 'all(.result == "success" or .result == "skipped")' \
            <<< '${{ toJson(needs) }}'
