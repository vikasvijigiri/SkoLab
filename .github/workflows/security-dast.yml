name: Security scan (OWASP ZAP)

# Weekly deep testing on CI staging (the production image on a GitHub
# runner), never production:
# - Schemathesis random exploration: unlike the deterministic PR gate, new
#   random inputs every week, many more per operation.
# - OWASP ZAP's API scan exercises every operation in
#   services/backend-go/api/openapi.yaml, signed in, and reports injection,
#   header, cookie and misconfiguration findings.
# Weekly and by hand; reports are attached to the run.
on:
  schedule:
    - cron: '0 4 * * 1' # Mondays 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-dast
  cancel-in-progress: false

jobs:
  zap:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: skolab
          POSTGRES_DB: skolab
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SKOLAB_FIREBASE_API_KEY: ${{ secrets.SKOLAB_FIREBASE_API_KEY }}
      SKOLAB_SYNTHETIC_EMAIL: ${{ secrets.SKOLAB_SYNTHETIC_EMAIL }}
      SKOLAB_SYNTHETIC_PASSWORD: ${{ secrets.SKOLAB_SYNTHETIC_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: ./.github/actions/staging
        with:
          firebase-service-account: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          # A scanner probes with bad input at speed; keep it from being
          # locked out of the very API it is scanning.
          extra-env: |
            AUTH_FAILED_LOGIN_BURST=100000
            RATE_LIMIT_USER_RPS=100000
            RATE_LIMIT_USER_BURST=100000
            RATE_LIMIT_IP_RPS=100000
            RATE_LIMIT_IP_BURST=100000
      - name: Sign in the monitoring account
        run: python services/loadtest/fixture.py --base-url http://127.0.0.1:8080
      - uses: ./.github/actions/qa-tools
      - name: Contract fuzzing, random exploration (Schemathesis)
        run: |
          st --config-file services/qa/schemathesis.toml run services/backend-go/api/openapi.yaml \
            --url http://127.0.0.1:8080 \
            --header "Authorization: Bearer $TOKEN" \
            --checks all \
            --exclude-operation-id deleteAccount \
            --exclude-operation-id compileProject \
            --exclude-operation-id compile \
            --exclude-operation-id sentryAlertHook \
            --max-examples 300 \
            --continue-on-failure \
            --report junit --report-dir zap/schemathesis
      - name: ZAP API scan
        run: |
          mkdir -p zap
          # The spec names production; point this copy at staging.
          sed 's#https://skolab-api.onrender.com#http://127.0.0.1:8080#' \
            services/backend-go/api/openapi.yaml > zap/openapi.yaml
          chmod -R a+rw zap
          status=0
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" \
            -e ZAP_AUTH_HEADER=Authorization \
            -e ZAP_AUTH_HEADER_VALUE="Bearer $TOKEN" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-api-scan.py -t /zap/wrk/openapi.yaml -f openapi \
              -r report.html -J report.json -w report.md -I || status=$?
          if [ -f zap/report.md ]; then cat zap/report.md >> "$GITHUB_STEP_SUMMARY"; fi
          # -I: warnings are reported, not fatal; failures (status 1) fail the run.
          [ "$status" -le 2 ] && [ "$status" -ne 1 ] || exit "$status"
      - name: ZAP report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: zap-report
          path: zap
          if-no-files-found: ignore
      - name: Staging logs
        if: failure()
        run: docker logs skolab-api 2>&1 | tail -n 200 || true
