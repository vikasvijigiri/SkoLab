name: regen-web-lockfile

# Throwaway probe: does --legacy-peer-deps (which skips the peer-edge code path
# where arborist null-derefs on 'edgesOut') let a full `npm install` complete?
# Runs the reify twice to check it is not just a lucky pass.

on:
  workflow_dispatch:
  push:
    branches: [fix/web-routecontext-tsc]
    paths: [.github/workflows/regen-web-lockfile.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        run: [a, b]
        flags:
          - "--legacy-peer-deps"
          - "--legacy-peer-deps --install-strategy=nested"
          - "--package-lock-only --legacy-peer-deps"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install ${{ matrix.flags }} (${{ matrix.run }})
        run: |
          rm -f package-lock.json
          rm -rf node_modules
          npm install --no-audit --no-fund ${{ matrix.flags }}
          echo "OK: npm install ${{ matrix.flags }}"
