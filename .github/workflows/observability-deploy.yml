name: Deploy monitoring to Grafana Cloud

# Grafana Cloud always matches what is deployed: release.yml calls this after
# every successful production release, so SLO rules, alerts, dashboards and
# synthetic checks are re-applied only once the service they watch is live
# (never probing a URL before it serves). Nothing runs on a developer
# machine -- the k6 journey executes on Grafana's probes. Credentials are
# repository secrets (Settings > Secrets and variables > Actions); see
# services/observability/README.md for the list.
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      test_alert:
        description: Also send a test notification through the contact point
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: grafana-monitoring
      cancel-in-progress: false
    timeout-minutes: 20
    env:
      GRAFANA_URL: ${{ secrets.GRAFANA_URL }}
      GRAFANA_TOKEN: ${{ secrets.GRAFANA_TOKEN }}
      GRAFANA_SM_TOKEN: ${{ secrets.GRAFANA_SM_TOKEN }}
      GRAFANA_CONTACT_POINT: ${{ secrets.GRAFANA_CONTACT_POINT }}
      SLACK_ALERT_WEBHOOK_URL: ${{ secrets.SLACK_ALERT_WEBHOOK_URL }}
      SKOLAB_FIREBASE_API_KEY: ${{ secrets.SKOLAB_FIREBASE_API_KEY }}
      SKOLAB_SYNTHETIC_EMAIL: ${{ secrets.SKOLAB_SYNTHETIC_EMAIL }}
      SKOLAB_SYNTHETIC_PASSWORD: ${{ secrets.SKOLAB_SYNTHETIC_PASSWORD }}
      # Admin SDK credentials: keep the monitoring account existing, enabled
      # and email-verified (the backend refuses unverified accounts).
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install the Firebase Admin SDK (same pin as the backend)
        run: pip install --quiet firebase-admin==7.5.0
      - name: Require Grafana credentials
        run: |
          for key in GRAFANA_URL GRAFANA_TOKEN GRAFANA_SM_TOKEN GRAFANA_CONTACT_POINT; do
            if [ -z "${!key}" ]; then echo "::error::Repository secret $key is not set"; exit 1; fi
          done
      - name: Configure Slack alert receiver
        if: ${{ env.SLACK_ALERT_WEBHOOK_URL != '' }}
        run: python services/observability/slack_contact.py
      - name: SLO recording rules, burn-rate alerts and backend dashboard
        run: |
          python services/observability/slo/provision.py --apply
          python services/observability/slo/provision.py --verify
      - name: Availability checks and alerts, plus the journey once configured
        run: |
          # The provisioner signs in as the monitoring account, creates (or
          # gets back) its workspace through POST /api/v1/workspaces, and
          # uploads the journey values to Grafana's secret manager.
          if [ -n "$SKOLAB_FIREBASE_API_KEY" ] && [ -n "$SKOLAB_SYNTHETIC_EMAIL" ] \
             && [ -n "$SKOLAB_SYNTHETIC_PASSWORD" ]; then
            # Runs the journey once on a Grafana probe first; a failing journey
            # is never scheduled, and this step fails so the merge is visibly red.
            python services/observability/provision.py --apply --journey
          else
            echo "::notice::Journey fixtures are not configured; deploying availability checks only"
            python services/observability/provision.py --apply
          fi
      - name: End-to-end notification test
        if: ${{ inputs.test_alert }}
        run: python services/observability/provision.py --test-alert
