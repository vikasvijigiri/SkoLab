name: Security Scan

# Secret scanning, code scanning, and fixable HIGH/CRITICAL dependency and
# configuration findings block releases. See services/security/README.md.

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Monday 06:00 UTC

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    name: gitleaks · semgrep · trivy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # gitleaks scans history

      - name: gitleaks (secret scanning)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: semgrep (SAST)
        run: |
          python -m pip install --quiet semgrep==1.176.0
          semgrep scan \
            --config p/python --config p/security-audit --config p/secrets \
            --oss-only --metrics=off --strict --error \
            --include '*.py' --include '*.go' --sarif --output semgrep.sarif \
            services/backend/app services/backend-go

      - name: Upload semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        continue-on-error: true
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: trivy (dependency + config scan)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          version: v0.75.0
          ignore-unfixed: false
          exit-code: '0'
          format: sarif
          output: trivy.sarif

      - name: Upload trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        continue-on-error: true
        with:
          sarif_file: trivy.sarif
          category: trivy

      - name: Enforce repository security findings
        run: trivy fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 .

      - name: Build production and isolated compile images
        run: |
          docker build -f deploy/skolab-api/Dockerfile -t skolab-api-security .
          docker build -f services/backend-go/Dockerfile.colab-sandbox -t skolab-sandbox-security services/backend-go

      - name: Scan production image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: skolab-api-security
          scanners: vuln
          severity: HIGH,CRITICAL
          version: v0.75.0
          ignore-unfixed: false
          exit-code: '0'
          format: sarif
          output: trivy-api-image.sarif

      - name: Scan compile image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: skolab-sandbox-security
          scanners: vuln
          severity: HIGH,CRITICAL
          version: v0.75.0
          ignore-unfixed: false
          exit-code: '0'
          format: sarif
          output: trivy-sandbox-image.sarif

      - name: Enforce fixable HIGH/CRITICAL image vulnerabilities
        run: |
          trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 skolab-api-security
          trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 skolab-sandbox-security

      - name: Software bill of materials (CycloneDX)
        # One SBOM per shipped image: what is inside each release, so a new
        # CVE can be checked against past releases without rebuilding them.
        run: |
          trivy image --format cyclonedx --output sbom-skolab-api.cdx.json skolab-api-security
          trivy image --format cyclonedx --output sbom-colab-sandbox.cdx.json skolab-sandbox-security

      - name: Security reports and SBOMs (including unfixed findings)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: security-reports
          path: |
            *.sarif
            sbom-*.cdx.json
          if-no-files-found: ignore
