name: Security Scan

# Informational, not a gate. Every scan step is continue-on-error and results
# are uploaded to the repo's Security tab as SARIF. The codebase has known
# pre-existing findings (e.g. f-string SQL in app/db/database.py's schema
# patcher — hardcoded literals, no user input); triage those and add
# suppressions before making any of these blocking.

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Monday 06:00 UTC

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    name: gitleaks · semgrep · trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans history

      - name: gitleaks (secret scanning)
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: semgrep (SAST)
        continue-on-error: true
        run: |
          python -m pip install --quiet semgrep
          semgrep scan \
            --config p/python --config p/security-audit --config p/secrets \
            --oss-only --metrics=off --sarif --output semgrep.sarif \
            services/backend/app services/backend-go || true

      - name: Upload semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: trivy (dependency + config scan)
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy.sarif

      - name: Upload trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: trivy.sarif
          category: trivy
