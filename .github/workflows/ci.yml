name: SkoLab backend CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: skolab
          POSTGRES_DB: skolab
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/backend/requirements-dev.txt
      - uses: actions/setup-go@v7
        with:
          go-version-file: services/backend-go/go.mod
      - name: Install Python dependencies
        working-directory: services/backend
        run: pip install --quiet -r requirements.txt -r requirements-dev.txt
      - name: Lint Python backend
        working-directory: services/backend
        run: ruff check .
      - name: Bootstrap backend schema
        working-directory: services/backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:skolab@localhost:5432/skolab
        run: python ci_bootstrap_db.py
      - name: Test Python backend
        working-directory: services/backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:skolab@localhost:5432/skolab
          DATABASE_ENCRYPTION_KEY: dGVzdF9kYXRhYmFzZV9lbmNyeXB0aW9uX2tleV8xMjM=
          GROQ_API: ci-test-groq-token-not-secret
          OPENROUTER_API_KEY: ci-test-openrouter-token-not-secret
        run: pytest tests/ --cov=app --cov-report=term-missing:skip-covered --cov-fail-under=38
      - name: Verify Go gateway
        working-directory: services/backend-go
        run: |
          go vet ./...
          go test ./... -race
