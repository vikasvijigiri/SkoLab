name: SkoLab backend CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: skolab
          POSTGRES_DB: skolab
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/backend/requirements-dev.txt
      - uses: actions/setup-go@v7
        with:
          go-version-file: services/backend-go/go.mod
      - name: Install Python dependencies
        working-directory: services/backend
        run: pip install --quiet -r requirements.txt -r requirements-dev.txt
      - name: Lint Python backend
        working-directory: services/backend
        run: ruff check .
      - name: Type-check Python backend
        working-directory: services/backend
        run: mypy app/ --ignore-missing-imports
      - name: Bootstrap backend schema
        working-directory: services/backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:skolab@localhost:5432/skolab
        run: python scripts/run_migrations.py
      - name: Install compiler for real sandbox integration tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends texlive-latex-base util-linux
      - name: Test Python backend
        working-directory: services/backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:skolab@localhost:5432/skolab
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:skolab@localhost:5432/skolab
          DATABASE_ENCRYPTION_KEY: dGVzdF9kYXRhYmFzZV9lbmNyeXB0aW9uX2tleV8xMjM=
        # 2026-09-27: raised from 38 after the scope cut to auth/authorization/
        # CoLab only shrank the codebase to a much better-tested core (79%
        # measured locally); 70 leaves real headroom, not a rubber-stamp floor.
        run: pytest tests/ --cov=app --cov-report=term-missing:skip-covered --cov-fail-under=70
      - name: Verify Go gateway
        working-directory: services/backend-go
        env:
          # Same Postgres the Python step bootstrapped above: the workspace
          # store's integration tests (transactions, idempotency and the
          # per-user cap under concurrency) run against the real schema.
          TEST_DATABASE_URL: postgres://postgres:skolab@localhost:5432/skolab
        run: |
          go vet ./...
          go test ./... -race -coverprofile=coverage.out
          # Floor, not target: raise it as coverage grows, never lower it.
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {sub("%", "", $3); print $3}')
          echo "Go statement coverage: ${total}%"
          echo "Go statement coverage: **${total}%** (floor 85%)" >> "$GITHUB_STEP_SUMMARY"
          awk -v t="$total" 'BEGIN { exit !(t >= 85) }' || { echo "::error::Go coverage ${total}% is below the 85% floor"; exit 1; }
      - name: Check Go formatting (informational)
        working-directory: services/backend-go
        # Non-blocking: gofmt was only ever a local pre-commit hook, never
        # checked in CI (2026-09-26 reliability audit), and there's no
        # golangci-lint config either. This makes drift visible without
        # blocking a build on formatting alone — no way to verify the current
        # pass/fail state locally (no Go toolchain in the environment that
        # authored this step), so it starts non-blocking on principle either way.
        continue-on-error: true
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::warning::gofmt would reformat:"
            echo "$unformatted"
            exit 1
          fi

  images:
    # A deployed gateway must fail startup without required dependencies.
    # Full release-mode router contracts are exercised by staging below.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build gateway image
        run: docker build -t skolab-gateway services/backend-go
      - name: Refuse release startup without Firebase credentials
        run: |
          docker run -d --name gateway -p 8080:8080 \
            -e GIN_MODE=release -e APP_ENV=ci -e INTERNAL_API_TOKEN=ci-only skolab-gateway
          exit_code=$(timeout 30s docker wait gateway)
          test "$exit_code" = 1
          docker logs gateway 2>&1 | grep -q 'Firebase initialization failed'
      - name: Gateway logs
        if: always()
        run: docker logs gateway || true

  staging:
    # A production-like environment for every PR and merge, at no cost: the
    # exact image Render runs (deploy/skolab-api: gateway + Python in one
    # container), booted on a fresh Postgres with real Firebase sign-in, then
    # put through the full QA suite (services/qa): the release smoke checks,
    # multi-user end-to-end scenarios (Hurl), the real-time WebSocket journey
    # (k6) and OpenAPI contract fuzzing (Schemathesis). Nothing reaches
    # production unless this passes. Secrets are throwaway values generated
    # per run, except the monitoring account's sign-in and the Firebase Admin
    # key; test users are temporary and deleted at the end.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: skolab
          POSTGRES_DB: skolab
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      SKOLAB_FIREBASE_API_KEY: ${{ secrets.SKOLAB_FIREBASE_API_KEY }}
      SKOLAB_SYNTHETIC_EMAIL: ${{ secrets.SKOLAB_SYNTHETIC_EMAIL }}
      SKOLAB_SYNTHETIC_PASSWORD: ${{ secrets.SKOLAB_SYNTHETIC_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Require staging secrets
        run: |
          for key in FIREBASE_SERVICE_ACCOUNT SKOLAB_FIREBASE_API_KEY SKOLAB_SYNTHETIC_EMAIL SKOLAB_SYNTHETIC_PASSWORD; do
            if [ -z "${!key}" ]; then echo "::error::Repository secret $key is not set"; exit 1; fi
          done
      - uses: ./.github/actions/staging
        with:
          firebase-service-account: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          # The contract fuzzer sends bad credentials on purpose; without
          # this the failed-login lockout would block the run's own IP.
          extra-env: |
            AUTH_FAILED_LOGIN_BURST=100000
      - name: Smoke-test staging (the same checks as production)
        run: python services/release/release.py --commit "$GITHUB_SHA" --smoke-only --base-url http://127.0.0.1:8080
      - uses: ./.github/actions/qa-tools
      - name: End-to-end scenarios (Hurl; owner, editor, viewer, outsider, deleted account)
        run: bash services/qa/e2e.sh http://127.0.0.1:8080 qa-reports
      - name: Sign in the monitoring account
        run: python services/loadtest/fixture.py --base-url http://127.0.0.1:8080
      - name: Real-time collaboration (k6 WebSocket journey)
        env:
          SKOLAB_GATEWAY_URL: http://127.0.0.1:8080
        run: |
          secrets="$RUNNER_TEMP/journey-secrets"
          {
            echo "skolab-firebase-api-key=$SKOLAB_FIREBASE_API_KEY"
            echo "skolab-monitor-email=$SKOLAB_SYNTHETIC_EMAIL"
            echo "skolab-monitor-password=$SKOLAB_SYNTHETIC_PASSWORD"
            echo "skolab-monitor-workspace=$WORKSPACE_ID"
          } > "$secrets"
          k6 run --quiet --secret-source "file=$secrets" services/observability/journey.js
          rm -f "$secrets"
      - name: Contract fuzzing against the OpenAPI spec (Schemathesis)
        run: |
          st --config-file services/qa/schemathesis.toml run services/backend-go/api/openapi.yaml \
            --url http://127.0.0.1:8080 \
            --header "Authorization: Bearer $TOKEN" \
            --checks all \
            --exclude-operation-id deleteAccount \
            --exclude-operation-id compile \
            --exclude-operation-id sentryAlertHook \
            --max-examples 25 \
            --generation-deterministic \
            --rate-limit 15/s \
            --report junit --report-dir qa-reports/schemathesis
      - name: QA reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qa-reports-staging
          path: qa-reports
          if-no-files-found: ignore
      - name: Backup and restore staging into an isolated database
        run: bash services/qa/restore-drill.sh
      - name: Staging logs
        if: always()
        run: docker logs skolab-api 2>&1 | tail -n 200 || true

  slo-rules:
    # The SLO alert rules are code: regenerated from one table, then checked
    # and unit-tested with promtool so a broken expression or a threshold that
    # can never fire fails here instead of silently never paging.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Rules file is up to date with generate.py
        run: python services/observability/slo/generate.py --check
      - name: Unit-test the Grafana provisioner
        run: python -m unittest discover -s services/observability/slo -p "test_*.py"
      - name: Unit-test the release script
        run: python -m unittest discover -s services/release -p "test_*.py"
      - name: Validate database connection budget logic
        run: python -m unittest discover -s services/backend/scripts -p "test_connection_budget.py"
      - name: Check and unit-test rules with promtool
        working-directory: services/observability/slo
        run: |
          promtool() { docker run --rm -v "$PWD:/slo" -w /slo --entrypoint promtool prom/prometheus:v3.15.0 "$@"; }
          promtool check rules skolab-slo.rules.yml
          promtool test rules skolab-slo.test.yml

  security:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/security-scan.yml

  release:
    permissions:
      contents: read
      actions: read
    # Only a push to master that passed every job above reaches production.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [build-and-test, images, slo-rules, staging, security]
    uses: ./.github/workflows/release.yml
    secrets: inherit
