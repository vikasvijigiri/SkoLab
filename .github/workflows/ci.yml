name: SkoLab CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ResQit2025!
          POSTGRES_DB: skolab
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Free disk space
      # `pip install -r requirements-dev.txt` pulls torch + sentence-transformers
      # (~2 GB unpacked). On a stock ubuntu-latest runner that tips the root FS
      # over and the install dies with `[Errno 28] No space left on device`,
      # which is what had this job red on every commit. Reclaiming the unused
      # Android SDK, .NET and Haskell toolchains frees ~20 GB.
      run: |
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
        df -h /

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: pip
        cache-dependency-path: services/backend/requirements-dev.txt

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: "1.25"

    - name: Compile Design Tokens
      run: |
        npm install
        npm run compile:tokens

    - name: Install Python Dependencies & Run Tests
      env:
        DATABASE_URL: postgresql+asyncpg://postgres:ResQit2025!@127.0.0.1:5432/skolab
        DATABASE_ENCRYPTION_KEY: dGVzdF9kYXRhYmFzZV9lbmNyeXB0aW9uX2tleV8xMjM=
        GROQ_API: gsk_fakekeyvaluelongerthan10chars
        OPENROUTER_API_KEY: sk-or-v1-fakekeyvalue
        GOOGLE_APPLICATION_CREDENTIALS: services/backend/service-account.json
        PAGERDUTY_PRIMARY_ONCALL_KEY: pd_key_primary_active
        PAGERDUTY_DB_SRE_KEY: pd_key_db_sre_active
      run: |
        cd services/backend
        python -m venv venv
        source venv/bin/activate
        # torch + the ML stack is ~2 GB from PyPI; the default single attempt
        # times out intermittently on files.pythonhosted.org.
        pip install --retries 6 --timeout 180 -r requirements-dev.txt
        # Create dummy service-account.json to satisfy SRE key audit
        echo '{"type": "service_account"}' > service-account.json
        # Bootstrap the schema against the CI Postgres (conftest only does this
        # on its SQLite fallback; alembic scripts only patch an assumed schema).
        # The script waits for the service container to actually accept queries
        # and retries init_db(), which otherwise fails flakily mid-transaction.
        python ci_bootstrap_db.py
        # Coverage floor as a no-regression ratchet. Real number today is ~40%
        # (measured against this Postgres job); --cov-fail-under=38 leaves a
        # little slack. Raise it as tests land — never lower it.
        pytest tests/ --cov=app --cov-report=term-missing:skip-covered --cov-fail-under=38

    - name: Verify Go Gateway Build
      run: |
        cd services/backend-go
        go mod tidy
        go build -o main .

    - name: Run Go Gateway Tests
      run: |
        cd services/backend-go
        go vet ./...
        # -cover across multiple packages invokes the `covdata` tool, which the
        # setup-go toolchain here does not ship ("go: no such tool covdata") and
        # which fails the step even though every test passes. -race is the check
        # that matters.
        go test ./... -race -v

  web-verification:
    name: Web Build, Typecheck, Lint & Test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install workspace dependencies
      # The committed lockfile is generated on Windows and records only the
      # win32 build of lightningcss / @tailwindcss-oxide, so `npm ci` on Linux
      # cannot resolve the native — hence the lockfile-less install here. That
      # resolve also intermittently trips an npm arborist bug
      # ("Cannot read properties of null (reading 'edgesOut')") on Linux *and*
      # Windows, regardless of npm version, so this retries with a cache clean
      # between attempts. The durable fix is a Linux-regenerated lockfile +
      # `npm ci` (see the retired regen-web-lockfile.yml probe).
      run: |
        npm install -g npm@10.9.2
        ok=
        for attempt in 1 2 3 4; do
          rm -f package-lock.json
          rm -rf node_modules
          if npm install --no-audit --no-fund; then ok=1; break; fi
          echo "::warning::npm install attempt $attempt failed (arborist flake); clearing cache and retrying"
          npm cache clean --force || true
          rm -rf ~/.npm/_cacache || true
          sleep 5
        done
        [ -n "$ok" ] || { echo "::error::npm install failed after 4 attempts"; exit 1; }
        # Belt-and-suspenders: a lockfile-less resolve on this runner should
        # already pull the Linux natives, but pin the ones `next build` needs
        # so a partial resolve cannot fail with
        # "Cannot find module '../lightningcss.linux-x64-gnu.node'".
        npm install --no-save --no-audit --no-fund \
          lightningcss-linux-x64-gnu@1.32.0 \
          @tailwindcss/oxide-linux-x64-gnu@4.3.3 || true

    # `next build` must run before standalone tsc: it generates `.next/types`,
    # which is where Next 16's `RouteContext` and route param types live. Running
    # `tsc --noEmit` first fails with "Cannot find name 'RouteContext'".
    - name: Production build (next build)
      run: npm run build --workspace web

    - name: Typecheck (tsc --noEmit)
      run: npm exec --workspace web -- tsc --noEmit

    - name: Lint (eslint)
      run: npm run lint --workspace web

    - name: Unit tests (vitest)
      run: npm run --workspace web test

    - name: Install Playwright browser
      run: npm exec --workspace web -- playwright install --with-deps chromium

    - name: E2E + a11y (playwright)
      run: npm run --workspace web test:e2e
      env:
        CI: "true"
