name: SkoLab CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ResQit2025!
          POSTGRES_DB: skolab
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: "1.24"

    - name: Compile Design Tokens
      run: |
        npm install
        npm run compile:tokens

    - name: Install Python Dependencies & Run Tests
      env:
        DATABASE_URL: postgresql+asyncpg://postgres:ResQit2025!@127.0.0.1:5432/skolab
        DATABASE_ENCRYPTION_KEY: dGVzdF9kYXRhYmFzZV9lbmNyeXB0aW9uX2tleV8xMjM=
        GROQ_API: gsk_fakekeyvaluelongerthan10chars
        OPENROUTER_API_KEY: sk-or-v1-fakekeyvalue
        GOOGLE_APPLICATION_CREDENTIALS: services/backend/service-account.json
        PAGERDUTY_PRIMARY_ONCALL_KEY: pd_key_primary_active
        PAGERDUTY_DB_SRE_KEY: pd_key_db_sre_active
      run: |
        cd services/backend
        python -m venv venv
        source venv/bin/activate
        pip install -r requirements-dev.txt
        # Create dummy service-account.json to satisfy SRE key audit
        echo '{"type": "service_account"}' > service-account.json
        pytest tests/

    - name: Verify Go Gateway Build
      run: |
        cd services/backend-go
        go mod tidy
        go build -o main .

    - name: Run Go Gateway Tests
      run: |
        cd services/backend-go
        go vet ./...
        go test ./... -v

  web-verification:
    name: Web Build, Typecheck & Lint
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install workspace dependencies
      run: npm install

    # `next build` must run before standalone tsc: it generates `.next/types`,
    # which is where Next 16's `RouteContext` and route param types live. Running
    # `tsc --noEmit` first fails with "Cannot find name 'RouteContext'".
    - name: Production build (next build)
      run: npm run build --workspace web

    - name: Typecheck (tsc --noEmit)
      run: npm exec --workspace web -- tsc --noEmit

    - name: Lint (eslint)
      run: npm run lint --workspace web
