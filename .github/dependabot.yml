# Dependabot version updates are turned OFF (2026-09-12), by explicit
# request: the automated PR volume (30+ open at once, across npm/pip/
# gradle/gomod/github-actions, several needing coordinated fixes like a
# Python/Node/Gradle/compileSdk version bump before they could even be
# evaluated) was costing more investigation time than it saved. Dependency
# updates are handled manually from here.
#
# To re-enable: restore an `updates:` list (git history has the full
# config this replaced, including the per-ecosystem `ignore`/`groups`
# rules worked out on 2026-09-12 — worth bringing back rather than
# starting over, since those rules exist for confirmed, real breakages).
#
# This only stops *version* updates. GitHub's separate Dependabot security
# updates (Settings -> Code security -> Dependabot security updates) are
# unrelated to this file and keep working if enabled — those only fire for
# actual CVEs, not routine version drift, so they weren't the source of
# the volume this turns off.
version: 2
updates: []
